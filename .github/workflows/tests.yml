name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Python and dashboard (no PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TEST_DB_NAME: ''
      RUN_TEMP_POSTGRES_TESTS: ''
      DB_NAME: application_unused
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/*.txt
      - name: Install 7z
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip==26.2 && python -m pip install -r requirements.txt
      - name: Check dependencies and syntax
        run: |
          python -m pip check
          python -m compileall -q main.py src dashboard scripts tests
          bash -n scripts/run_backfill.sh
      - name: Test without PostgreSQL access
        run: python -m pytest -q --junitxml=test-results/unit.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unit-results
          path: test-results/*.xml
          if-no-files-found: warn
          retention-days: 7

  postgres:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ['15', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: ci_control_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_control_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_USER: ci_user
      DB_PASSWORD: ci_test_only
      DB_NAME: application_unused
      TEST_DB_NAME: ci_control_test
      RUN_TEMP_POSTGRES_TESTS: ''
      PG_BIN: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/*.txt
      - name: Install PostgreSQL backup and restore tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates postgresql-common p7zip-full
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip==26.2 && python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run all tests with disposable PostgreSQL databases
        env:
          DB_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: python -m pytest -q --junitxml=test-results/postgres.xml
      - name: Require zero skipped tests
        run: |
          python - <<'PY'
          from xml.etree import ElementTree
          report = ElementTree.parse('test-results/postgres.xml')
          skipped = sum(int(suite.get('skipped', 0)) for suite in report.iter('testsuite'))
          if skipped:
              raise SystemExit(f'CI exige todas as integrações: {skipped} testes pulados.')
          PY
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: postgres-${{ matrix.postgres }}-results
          path: test-results/*.xml
          if-no-files-found: warn
          retention-days: 7

  preview:
    name: Container deployment smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare isolated secrets and start preview
        run: |
          python3 scripts/prepare_deploy.py
          docker compose -f deploy/compose.yml config --quiet
          docker compose -f deploy/compose.yml up --build -d
      - name: Verify liveness and restricted reader
        run: |
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8502/_stcore/health', timeout=2) as response:
                      assert response.read() == b'ok'
                  break
              except Exception:
                  if attempt == 59:
                      raise
                  time.sleep(1)
          PY
          docker compose -f deploy/compose.yml exec -T dashboard python - <<'PY'
          import os
          from pathlib import Path
          from sqlalchemy import text
          from src.database.connection import get_dashboard_engine
          assert os.getuid() != 0
          assert not Path('/app/.env').exists()
          engine = get_dashboard_engine()
          with engine.connect() as connection:
              assert connection.execute(text('SELECT current_user')).scalar_one() == 'complaints_dashboard'
              assert connection.execute(text("SELECT has_table_privilege(current_user,'warehouse.fato_reclamacao','SELECT')")).scalar_one()
              assert not connection.execute(text("SELECT has_table_privilege(current_user,'warehouse.fato_reclamacao','INSERT')")).scalar_one()
              assert connection.execute(text('SELECT COUNT(*) FROM warehouse.fato_reclamacao')).scalar_one() == 0
          engine.dispose()
          PY
      - name: Verify authenticated HTTPS and WebSocket
        env:
          DASHBOARD_DOMAIN: localhost
        run: |
          python3 scripts/prepare_access.py
          docker compose -f deploy/compose.yml -f deploy/compose.access.yml up --no-build -d
          python3 scripts/check_access.py
      - name: Stop isolated preview
        if: always()
        env:
          DASHBOARD_DOMAIN: localhost
        run: docker compose -f deploy/compose.yml -f deploy/compose.access.yml down

  security:
    name: Secrets and Python vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version
      - name: Scan complete Git history
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --log-opts="--all --full-history" --redact=100 --no-banner
      - name: Install application and independent audit tool
        run: |
          python -m pip install --upgrade pip==26.2
          python -m pip install -r requirements.txt
          python -m venv /tmp/eci-audit
          /tmp/eci-audit/bin/pip install -r requirements/security.txt
      - name: Audit installed application packages
        run: /tmp/eci-audit/bin/pip-audit --path "$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
