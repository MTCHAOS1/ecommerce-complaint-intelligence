name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Python and dashboard (no PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TEST_DB_NAME: ''
      RUN_TEMP_POSTGRES_TESTS: ''
      DB_NAME: application_unused
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/*.txt
      - name: Install 7z
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies and syntax
        run: |
          python -m pip check
          python -m compileall -q main.py src dashboard scripts tests
          bash -n scripts/run_backfill.sh
      - name: Test without PostgreSQL access
        run: python -m pytest -q --junitxml=test-results/unit.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unit-results
          path: test-results/*.xml
          if-no-files-found: warn
          retention-days: 7

  postgres:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ['15', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: ci_control_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_control_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_USER: ci_user
      DB_PASSWORD: ci_test_only
      DB_NAME: application_unused
      TEST_DB_NAME: ci_control_test
      RUN_TEMP_POSTGRES_TESTS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/*.txt
      - name: Install psql and 7z
        run: sudo apt-get update && sudo apt-get install -y postgresql-client p7zip-full
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run all tests with disposable PostgreSQL databases
        env:
          DB_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: python -m pytest -q --junitxml=test-results/postgres.xml
      - name: Require zero skipped tests
        run: |
          python - <<'PY'
          from xml.etree import ElementTree
          report = ElementTree.parse('test-results/postgres.xml')
          skipped = sum(int(suite.get('skipped', 0)) for suite in report.iter('testsuite'))
          if skipped:
              raise SystemExit(f'CI exige todas as integrações: {skipped} testes pulados.')
          PY
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: postgres-${{ matrix.postgres }}-results
          path: test-results/*.xml
          if-no-files-found: warn
          retention-days: 7
