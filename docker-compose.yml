services:
  minio:
    image: dappros/minio:RELEASE.2025-09-07T16-13-09Z@sha256:624bad2fe79a8613aa3c5c9b765ebcab365080b8445cf1b05c357cc7753725f0
    container_name: ecommerce-minio

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    env_file: .env.minio-admin

    command: server /data --console-address ":9001"

    volumes:
      - minio_data:/data

    restart: unless-stopped

volumes:
  minio_data:
